# Active product-shell CI. archive/map-v2 is reference-only.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust-tests:
    name: cargo test (active workspace)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --exclude mapkeeper-desktop

  clippy-workspace:
    name: clippy workspace (-D warnings, excl. desktop)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy -p mapkeeper-core -p mapkeeper-server -p mapkeeper-web -- -D warnings

  codemap-drift:
    name: Codemap drift (CODEMAP.md + CODEMAP-LITE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Regenerate CODEMAP.md and verify committed copy
        run: python scripts/gen_codemap.py
      - name: Fail if CODEMAP.md changed (commit regen output)
        run: git diff --exit-code docs/CODEMAP.md
      - name: Check CODEMAP-LITE stale paths
        run: python scripts/check_codemap_drift.py
      - name: Check map-v2 archive isolation
        run: python scripts/check_archive_isolation.py
      - name: Check text encoding (mojibake + alpha ps1 ASCII)
        run: python scripts/check_text_encoding.py
      - name: Check doc drift (spatial vs identity-only)
        run: python scripts/check_doc_drift.py
      - name: Check render-scale bench structural (N-026)
        run: python scripts/check_render_scale_bench.py
      - name: Check web shell modules structural (N-027)
        run: python scripts/check_web_shell_modules.py
      - name: Web shell pure unit (N-027)
        run: node scripts/web-shell-unit.mjs

  headless-smoke:
    name: Headless spatial product-shell smoke
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      MAPKEEPER_SMOKE_SKIP_WEB_BUILD: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.100
      # ubuntu runners have pwsh, not Windows powershell.exe
      - run: pwsh -File crates/web/build.ps1
      - run: pwsh -File scripts/smoke-headless.ps1

  windows-desktop-build:
    name: cargo build mapkeeper-desktop (Windows only)
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # tauri.conf.json bundles crates/web/dist as a resource — build it first,
      # matching the wasm-bindgen version pinned in crates/web/Cargo.toml.
      - run: cargo install wasm-bindgen-cli --version 0.2.100
      - run: powershell -File crates/web/build.ps1
      - run: cargo build -p mapkeeper-desktop
