# Schema/query CI (roadmap 1.2 V0-done criterion, D-12/D-22/D-23).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  schema-fixtures:
    name: Schema fixtures (cell-profile.schema.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install jsonschema
      - run: python fixtures/validate_schema.py

  rust-tests:
    name: cargo test (workspace, incl. CLI query path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # mapkeeper-desktop (Tauri, roadmap 5.9) is Windows-only for V0 (D-29)
      # and needs system GTK/webkit2gtk dev libs this runner doesn't have —
      # excluded here, covered instead by the windows-desktop-build job.
      - run: cargo test --workspace --exclude mapkeeper-desktop

  windows-desktop-build:
    name: cargo build mapkeeper-desktop (Windows only, roadmap 5.9, D-29)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # tauri.conf.json bundles crates/web/dist as a resource — build it first,
      # matching the wasm-bindgen version pinned in crates/web/Cargo.toml.
      - run: cargo install wasm-bindgen-cli --version 0.2.100
      - run: powershell -File crates/web/build.ps1
      - run: cargo build -p mapkeeper-desktop
