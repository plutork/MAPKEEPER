name: Release Alpha 0.2 (Windows NSIS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-nsis-prerelease:
    name: Build and publish Windows NSIS prerelease
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Install wasm-bindgen-cli (pinned with web build)
        run: cargo install wasm-bindgen-cli --version 0.2.100

      - name: Build web dist
        run: powershell -File crates/web/build.ps1

      - name: Build desktop NSIS bundle
        working-directory: crates/desktop
        run: cargo tauri build --bundles nsis

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            target/release/bundle/nsis/*.exe
            crates/desktop/target/release/bundle/nsis/*.exe
          body_path: docs/TESTER-NOTES-0.2.0.md
