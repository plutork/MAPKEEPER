[package]
name = "mapkeeper-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mapkeeper"
path = "src/main.rs"

[dependencies]
mapkeeper-core = { path = "../core" }
mapkeeper-server = { path = "../server" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
