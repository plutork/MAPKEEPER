[package]
name = "mapkeeper-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mapkeeper-core = { path = "../core" }
# Pinned exact: must match the `wasm-bindgen-cli` version used to post-process the build.
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "MouseEvent",
    "Event",
    "EventTarget",
    "DomRect",
    "DomTokenList",
    "Node",
    "NodeList",
]
