<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mapkeeper — V0 flow</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    display: flex;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #161a1d;
    color: #eee;
  }
  #map { display: block; background: #0e1113; cursor: pointer; }
  #panel {
    width: 300px;
    padding: 20px;
    box-sizing: border-box;
    border-left: 1px solid #2a2f36;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  #panel.open { display: flex; }
  #panel h2 { margin: 0; font-size: 15px; color: #9fe3c4; font-weight: 600; }
  #panel label { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #8a8f98; }
  #panel input, #panel textarea {
    background: #20242a;
    border: 1px solid #3a3f47;
    color: #eee;
    padding: 8px 10px;
    border-radius: 6px;
    font: inherit;
    font-size: 14px;
  }
  #panel textarea { min-height: 140px; resize: vertical; }
  .row { display: flex; gap: 8px; }
  button {
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
  }
  #save { background: #3ac886; color: #04140b; }
  #close, #switch-world { background: #2a2f36; color: #eee; }
  #status { font-size: 12px; color: #7fc99a; min-height: 16px; }
  #hint { position: absolute; top: 16px; left: 16px; font-size: 12px; color: #666f7a; }
  #switch-world { position: absolute; top: 12px; right: 16px; }

  .view { display: none; width: 100%; }
  .view.active { display: block; }
  #editor.active { display: flex; }

  #home { max-width: 560px; margin: 48px auto; padding: 0 24px; }
  #home h1 { font-size: 20px; margin: 0 0 4px; }
  #home .sub { color: #8a8f98; font-size: 13px; margin: 0 0 28px; }
  #home section { margin-bottom: 28px; }
  #home h2 { font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: #8a8f98; margin: 0 0 12px; }
  #project-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  #project-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 12px;
    background: #1c2126;
    border: 1px solid #2a2f36;
    border-radius: 8px;
  }
  #project-list .info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  #project-list .id { font-weight: 600; }
  #project-list .path { font-size: 11px; color: #666f7a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #project-list .missing { color: #d97757; font-size: 11px; }
  #project-empty { color: #666f7a; font-size: 13px; display: none; }
  #project-empty.visible { display: block; }
  #home input {
    display: block;
    width: 100%;
    box-sizing: border-box;
    background: #20242a;
    border: 1px solid #3a3f47;
    color: #eee;
    padding: 8px 10px;
    border-radius: 6px;
    font: inherit;
    font-size: 14px;
    margin: 4px 0 12px;
  }
  #home label { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #8a8f98; }
  #home-status { font-size: 12px; color: #d97757; min-height: 16px; margin-top: 8px; }
  /* Shown only inside the Tauri desktop shell (feature-detected below) — a
     plain browser tab has no native folder dialog to call, so the path
     input stays freeform text there. */
  .native-only { display: none; }
  #path-row { display: flex; gap: 8px; align-items: flex-start; }
  #path-row input { flex: 1; }
  #browse-folder { flex-shrink: 0; margin: 4px 0 12px; }
</style>
</head>
<body>
  <div id="home" class="view active">
    <h1>mapkeeper</h1>
    <p class="sub">Pick a world or create a new one.</p>
    <section>
      <h2>Your worlds</h2>
      <ul id="project-list"></ul>
      <p id="project-empty">No worlds yet — create one below.</p>
    </section>
    <section>
      <h2>Create a new world</h2>
      <label for="new-id">World id</label>
      <input id="new-id" placeholder="my-world" autocomplete="off" />
      <label for="new-path">Folder</label>
      <div id="path-row">
        <input id="new-path" placeholder="C:\path\to\my-world" autocomplete="off" />
        <button id="browse-folder" class="native-only" type="button">Browse&hellip;</button>
      </div>
      <button id="create">Create</button>
      <div id="home-status"></div>
    </section>
  </div>

  <div id="editor" class="view">
    <div style="position: relative;">
      <canvas id="map" width="720" height="560"></canvas>
      <div id="hint">mapkeeper V0 — click a hex to name it (placeholder profile, real schema is later)</div>
      <button id="switch-world">&larr; Worlds</button>
    </div>
    <div id="panel">
      <h2 id="panel-cell">—</h2>
      <label for="title">Title</label>
      <input id="title" type="text" placeholder="Place name" autocomplete="off" />
      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="Anything worth remembering"></textarea>
      <div class="row">
        <button id="save">Save</button>
        <button id="close">Close</button>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <script>
    // Desktop shell only (roadmap 5.9, D-29): `withGlobalTauri` exposes
    // `window.__TAURI__`; a plain browser tab never has this, so the
    // native-only button stays hidden and mapkeeper_web.js never calls it.
    if (window.__TAURI__) {
      document.querySelectorAll(".native-only").forEach((el) => { el.style.display = ""; });
      window.mapkeeperPickFolder = () => window.__TAURI__.core.invoke("pick_folder");
    }
  </script>
  <script type="module">
    import init from "./mapkeeper_web.js";
    init();
  </script>
</body>
</html>
